<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selfie Rewards Club</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #00cec9;
            --dark: #2d3436;
            --light: #f9f9f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a29bfe, #74b9ff);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--dark);
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            margin-top: 0;
            color: var(--primary);
        }

        .stats-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--light);
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            border: 2px solid #e1b12c;
        }

        .camera-box {
            position: relative;
            width: 100%;
            height: 320px;
            background: #dfe6e9;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        button:hover {
            background: #5b4cc4;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .result-card {
            margin-top: 20px;
            padding: 15px;
            background: #e3fafc;
            border-left: 5px solid var(--secondary);
            border-radius: 5px;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        .compliment {
            font-size: 18px;
            font-weight: bold;
            color: #0b7285;
            margin-bottom: 5px;
        }

        .reward-alert {
            color: #e67e22;
            font-weight: bold;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Selfie Rewards</h1>
    <p>Smile, snap a selfie, and claim your prize!</p>

    <div class="stats-container">
        <div class="stat-box">🪙 Coins: <span id="coin-count">0</span></div>
    </div>

    <div class="camera-box">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <button id="snap-btn">📸 Take Selfie</button>

    <div class="result-card" id="result-card">
        <div class="compliment" id="compliment-text">You look fantastic!</div>
        <div class="reward-alert" id="reward-text">+10 Coins Added!</div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const snapBtn = document.getElementById('snap-btn');
    const resultCard = document.getElementById('result-card');
    const complimentText = document.getElementById('compliment-text');
    const rewardText = document.getElementById('reward-text');
    const coinCountSpan = document.getElementById('coin-count');

    let totalCoins = 0;
    let isShowingSelfie = false;

    const compliments = [
        "Stunning! Your smile lights up the room! ✨",
        "Absolutely gorgeous! 🌟",
        "That angle is perfect on you! 📸",
        "Looking incredibly sharp today! 😎",
        "Your energy is brilliant! Keep smiling! ☀️",
        "Pure perfection! High fashion status. 🔥"
    ];

    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = stream;
        } catch (e) {
            alert("Camera access is required for this app to work.");
            console.error("Error accessing camera:", e);
        }
    }

    snapBtn.addEventListener('click', () => {
        if (!isShowingSelfie) {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.style.display = 'block';
            video.style.display = 'none';

            const randomCompliment = compliments[Math.floor(Math.random() * compliments.length)];
            const earnedCoins = Math.floor(Math.random() * 15) + 10;
            
            totalCoins += earnedCoins;

            complimentText.innerText = randomCompliment;
            rewardText.innerText = `🎁 You won +${earnedCoins} Coins!`;
            coinCountSpan.innerText = totalCoins;

            resultCard.style.display = 'block';
            snapBtn.innerText = "🔄 Take Another";
            isShowingSelfie = true;
        } else {
            canvas.style.display = 'none';
            video.style.display = 'block';
            resultCard.style.display = 'none';
            snapBtn.innerText = "📸 Take Selfie";
            isShowingSelfie = false;
        }
    });

    window.addEventListener('load', initCamera);
</script>

</body>
</html>
